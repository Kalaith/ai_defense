name: AI Defense CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks-and-webgl:
    name: Check, test, and build WebGL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_defense

    steps:
      - name: Checkout AI Defense
        uses: actions/checkout@v4
        with:
          path: ai_defense

      - name: Checkout macroquad-toolkit
        uses: actions/checkout@v4
        with:
          repository: Kalaith/macroquad-toolkit
          path: macroquad-toolkit

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ai_defense/target
          key: ${{ runner.os }}-ai-defense-cargo-${{ hashFiles('ai_defense/Cargo.lock', 'ai_defense/Cargo.toml', 'macroquad-toolkit/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-ai-defense-cargo-

      - name: Verify project files
        run: |
          test -f Cargo.toml
          test -f index.html
          test -s catalog_thumbnail.png
          test -f storage.js
          test -d assets
          test -d ../macroquad-toolkit
          grep -q 'load("ai_defense.wasm")' index.html

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build WebGL release
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Verify WebGL output
        run: test -s target/wasm32-unknown-unknown/release/ai_defense.wasm

  windows-build:
    name: Build Windows release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai_defense

    steps:
      - name: Checkout AI Defense
        uses: actions/checkout@v4
        with:
          path: ai_defense

      - name: Checkout macroquad-toolkit
        uses: actions/checkout@v4
        with:
          repository: Kalaith/macroquad-toolkit
          path: macroquad-toolkit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ai_defense/target
          key: ${{ runner.os }}-ai-defense-cargo-${{ hashFiles('ai_defense/Cargo.lock', 'ai_defense/Cargo.toml', 'macroquad-toolkit/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-ai-defense-cargo-

      - name: Build Windows release
        run: cargo build --release

      - name: Verify Windows output
        run: |
          if (-not (Test-Path "target\release\ai_defense.exe" -PathType Leaf)) {
            throw "Missing target\release\ai_defense.exe"
          }
